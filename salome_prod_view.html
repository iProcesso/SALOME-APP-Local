<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALOME TV — Produtividade</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--bg2:#151f33;--bg3:#1e2b45;--brd:#2a3a5c;--acc:#ef4444;--grn:#34d399;--yel:#fbbf24;--pur:#a78bfa;--blu:#3b82f6;--blu2:#60a5fa;--tx:#f1f5f9;--tx2:#9fb0cc;--tx3:#64748b;--f:'DM Sans',sans-serif;--m:'DM Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--f);background:radial-gradient(1200px 600px at 80% -10%,rgba(239,68,68,.10),transparent),var(--bg);color:var(--tx);overflow:hidden;}
.tv{height:100vh;display:flex;flex-direction:column;padding:2.2vh 2.4vw;}
.hd{display:flex;align-items:center;gap:1.4vw;padding-bottom:1.6vh;border-bottom:1px solid var(--brd);}
.logo{width:3.4vw;height:3.4vw;min-width:46px;min-height:46px;border-radius:12px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:var(--m);font-weight:600;font-size:1.5vw;color:#0b1220;}
.htit{font-size:2.0vw;font-weight:800;line-height:1;}
.hsub{font-size:1.0vw;color:var(--tx3);margin-top:.4vh;}
.empbig{margin-left:auto;text-align:right;}
.empbig .e{font-size:1.9vw;font-weight:800;color:var(--acc);font-family:var(--m);line-height:1;}
.empbig .l{font-size:.85vw;color:var(--tx3);letter-spacing:2px;text-transform:uppercase;}
.clock{font-family:var(--m);font-size:1.1vw;color:var(--tx2);margin-left:1.6vw;}
.stage{flex:1;position:relative;}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s;display:flex;flex-direction:column;padding-top:2vh;pointer-events:none;}
.slide.on{opacity:1;pointer-events:auto;}
.slide-t{font-size:1.3vw;font-weight:700;color:var(--tx2);margin-bottom:1.4vh;display:flex;align-items:center;gap:.7vw;}
.slide-t .pill{font-size:.8vw;font-weight:600;color:var(--tx3);background:var(--bg2);border:1px solid var(--brd);border-radius:20px;padding:.3vh .8vw;}
.rows{flex:1;display:flex;flex-direction:column;gap:1.1vh;justify-content:center;}
.row{display:flex;align-items:center;gap:1.2vw;background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:1.4vh 1.4vw;}
.veic{font-size:2.2vw;width:2.6vw;text-align:center;}
.rname{width:20vw;}
.rname .n{font-size:1.35vw;font-weight:700;}
.rname .c{font-size:.85vw;color:var(--tx3);font-family:var(--m);}
.track{flex:1;height:2.4vh;min-height:16px;border-radius:8px;background:var(--bg3);position:relative;overflow:visible;}
.fill{height:100%;border-radius:8px;}
.tick{position:absolute;top:-.6vh;bottom:-.6vh;width:3px;border-radius:2px;}
.tick .tl{position:absolute;top:-2vh;left:50%;transform:translateX(-50%);font-size:.72vw;font-family:var(--m);white-space:nowrap;}
.rnum{width:12vw;text-align:right;}
.rnum .big{font-size:1.8vw;font-weight:800;font-family:var(--m);line-height:1;}
.rnum .sm{font-size:.85vw;color:var(--tx3);}
.mix{flex:1;display:flex;flex-direction:column;gap:1.1vh;justify-content:center;}
.mrow{display:flex;align-items:center;gap:1.2vw;}
.mname{width:22vw;font-size:1.25vw;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mbar{flex:1;height:2.6vh;min-height:18px;border-radius:8px;background:var(--bg3);overflow:hidden;}
.mfill{height:100%;border-radius:8px;background:linear-gradient(90deg,#3b82f6,#60a5fa);}
.mval{width:12vw;text-align:right;font-family:var(--m);font-size:1.4vw;font-weight:700;}
.mval span{font-size:.9vw;color:var(--tx3);font-weight:500;}
.vazio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;color:var(--tx3);}
.vazio .ic{font-size:4vw;opacity:.4;}.vazio .t{font-size:1.4vw;font-weight:600;}
.ft{display:flex;align-items:center;gap:1vw;padding-top:1.4vh;border-top:1px solid var(--brd);font-size:.9vw;color:var(--tx3);}
.dots{display:flex;gap:.5vw;margin-left:auto;}
.dt{width:.8vw;height:.8vw;border-radius:50%;background:var(--brd);}
.dt.on{background:var(--acc);}
.leg{display:flex;gap:1.4vw;font-size:.85vw;color:var(--tx2);}
.leg i{display:inline-block;width:1.4vw;height:0;border-top:3px dashed;vertical-align:middle;margin-right:.4vw;}
</style>
</head>
<body>
<div class="tv">
  <div class="hd">
    <div class="logo">S</div>
    <div><div class="htit">Produtividade</div><div class="hsub" id="hsub">Painel operacional</div></div>
    <div class="empbig"><div class="e" id="empName">—</div><div class="l">Unidade</div></div>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div class="stage">
    <div class="slide on" id="s1">
      <div class="slide-t">🎯 Atingimento de meta por atividade <span class="pill">realizado vs meta</span>
        <span class="leg" style="margin-left:auto"><span><i style="border-color:#fbbf24"></i>Meta</span><span><i style="border-color:#a78bfa"></i>Padrão (média das 3)</span></span></div>
      <div class="rows" id="rows"></div>
    </div>
    <div class="slide" id="s2">
      <div class="slide-t">🧩 Composição do tempo — onde a unidade se dedica <span class="pill">participação por tempo</span></div>
      <div class="mix" id="mix"></div>
    </div>
  </div>
  <div class="ft"><span id="ftInfo">Carregando…</span>
    <div class="dots"><div class="dt on" id="d0"></div><div class="dt" id="d1"></div></div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbz1rfecoojBXHiwc01QEZXAOqGLBZa48SYWtvk6tD5hzgxQJZyRS_b62MOz7RUuKdBOag/exec";
const EMPRESA=(new URLSearchParams(location.search).get("empresa")||"SJRP").toUpperCase();
const DIAS=parseInt(new URLSearchParams(location.search).get("dias")||"7",10)||7;
const REFRESH_MS=120000, ROTA_MS=60000; // dados 2 min · rodízio 1 min
document.getElementById("empName").textContent=EMPRESA;
document.getElementById("hsub").textContent="Painel operacional · atualiza a cada 2 min · últimos "+DIAS+" dias";

function api(fn,arg){
  return fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({fn,arg:arg||null})})
    .then(r=>r.json()).then(r=>{if(r&&r.__erro)throw new Error(r.__erro);return r;});
}
function tier(pct){return pct>110?"acima":pct<95?"abaixo":"meta";}
function veic(t){return t==="acima"?"🚚":t==="meta"?"🚗":"🚲";}
function cor(t){return t==="acima"?"#34d399":t==="meta"?"#fbbf24":"#ef4444";}
function fmtH(min){const h=min/60;return (h>=10?Math.round(h):h.toFixed(1))+"h";}

let DADOS=null;
function buildS1(){
  const el=document.getElementById("rows");
  const ats=(DADOS&&DADOS.atividades)||[];
  if(!ats.length){el.innerHTML='<div class="vazio"><div class="ic">🎯</div><div class="t">Sem apontamentos com meta e quantidade no período.</div></div>';return;}
  const top=ats.slice(0,6);
  const escala=Math.max.apply(null,top.map(d=>Math.max(d.meta,d.real,d.padrao)))*1.15||1;
  el.innerHTML=top.map(d=>{const t=tier(d.pct);return `
    <div class="row">
      <div class="veic">${veic(t)}</div>
      <div class="rname"><div class="n">${d.desc}</div><div class="c">${d.cod}</div></div>
      <div class="track">
        <div class="fill" style="width:${Math.min(100,d.real/escala*100)}%;background:${cor(t)}"></div>
        <div class="tick" style="left:${d.meta/escala*100}%;background:#fbbf24"><span class="tl" style="color:#fbbf24">meta ${d.meta}</span></div>
        <div class="tick" style="left:${d.padrao/escala*100}%;background:#a78bfa"></div>
      </div>
      <div class="rnum"><div class="big" style="color:${cor(t)}">${d.real}<span style="font-size:.9vw;color:var(--tx3)"> ${d.unidade||""}</span></div><div class="sm">${d.pct}% da meta · padrão ${d.padrao}</div></div>
    </div>`;}).join("");
}
function buildS2(){
  const el=document.getElementById("mix");
  const comp=(DADOS&&DADOS.composicao)||[];
  if(!comp.length){el.innerHTML='<div class="vazio"><div class="ic">🧩</div><div class="t">Sem tempo apontado no período.</div></div>';return;}
  const top=comp.slice(0,8);const max=Math.max.apply(null,top.map(a=>a.pct))||1;
  el.innerHTML=top.map(a=>`
    <div class="mrow"><div class="mname">${a.desc}</div>
    <div class="mbar"><div class="mfill" style="width:${a.pct/max*100}%"></div></div>
    <div class="mval">${a.pct.toFixed(1)}% <span>· ${fmtH(a.min)}</span></div></div>`).join("");
}

// ── demonstração (fallback até o .gs ser reimplantado) ──
function gerarDemo(){
  const seedBase={SJRP:3,OSASCO:7,CPS:11}[EMPRESA]||5; let s=seedBase;
  const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  const M=[["DESCARGA-001",100,"cx/h","Descarregamento"],["ARMAZEM-001",150,"cx/h","Movimentação armazém"],["ARMAZEM-003",80,"cx/h","Separação p/ expedição"],["CARGA-002",90,"cx/h","Carregamento embarque"],["PALET-001",15,"plt/h","Montagem palete"],["PALET-003",25,"plt/h","Pesagem palete"],["CARGA-003",120,"cx/h","Conferência pré-embarque"],["ARMAZEM-002",120,"cx/h","Organização armazém"]];
  const ats=M.map(m=>{const real=Math.round(m[1]*(0.8+rnd()*0.5));const padrao=Math.round(m[1]*(0.9+rnd()*0.25));return {cod:m[0],desc:m[3],unidade:m[2],meta:m[1],real,padrao,pct:Math.round(real/m[1]*100)};}).sort((a,b)=>b.pct-a.pct);
  const extra=[["TRANSPORTE-001","Dirigindo"],["INATIVO-001","Inativo"],["ADMIN-002","Briefing"]];
  const comp=M.map(m=>({cod:m[0],desc:m[3],min:60+Math.round(rnd()*400)})).concat(extra.map(e=>({cod:e[0],desc:e[1],min:120+Math.round(rnd()*500)})));
  const tot=comp.reduce((x,c)=>x+c.min,0);comp.forEach(c=>c.pct=Math.round(c.min/tot*1000)/10);comp.sort((a,b)=>b.min-a.min);
  return {ok:true,empresa:EMPRESA,demo:true,atividades:ats,composicao:comp};
}

async function carregar(){
  try{
    const r=await api("wsGetPainelProdTV",{empresa:EMPRESA,dias:DIAS});
    if(r&&r.atividades){DADOS=r;}
    else DADOS=gerarDemo();
  }catch(e){DADOS=gerarDemo();}
  buildS1();buildS2();
  const dem=DADOS&&DADOS.demo?" · (demonstração — reimplante o Apps Script)":"";
  document.getElementById("_dem")&&(document.getElementById("_dem").textContent=dem);
  atualizarFt();
}
function atualizarFt(){
  const dem=DADOS&&DADOS.demo?" · demonstração":"";
  document.getElementById("ftInfo").textContent=(cur===0
    ? "Atingimento de meta · unidade "+EMPRESA+" · barra = realizado, marcas = meta e padrão"
    : "Composição por tempo · unidade "+EMPRESA)+dem;
}

function tick(){const d=new Date();document.getElementById("clock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
tick();setInterval(tick,20000);

let cur=0;const slides=["s1","s2"];
function show(i){slides.forEach((sname,k)=>document.getElementById(sname).classList.toggle("on",k===i));
  document.getElementById("d0").classList.toggle("on",i===0);document.getElementById("d1").classList.toggle("on",i===1);atualizarFt();}
show(0);
setInterval(()=>{cur=(cur+1)%slides.length;show(cur);},ROTA_MS);   // rodízio a cada 1 minuto
setInterval(carregar,REFRESH_MS);                                 // recarrega dados a cada 2 min
carregar();
</script>
</body>
</html>
